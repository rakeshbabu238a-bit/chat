server:
  port: ${PORT:8082}

spring:
  application:
    name: llm-chat-app

  # H2 Database (dev default) — switch to PostgreSQL via environment variables for production
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/chatapp;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # H2 Console (dev only)
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  # Email (Gmail SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:rakeshbabu238.a@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true

groq:
  api:
    key: ${GROQ_API_KEY:}
  model: llama-3.3-70b-versatile

# App-specific config
app:
  admin-email: ${ADMIN_EMAIL:rakeshbabu238.a@gmail.com}
  base-url: ${APP_BASE_URL:http://localhost:8082}
  jwt:
    secret: ${JWT_SECRET:myDefaultSuperSecretKeyForJWTTokenGenerationThatIsLongEnough2024}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://pinnacle-tech.in,https://www.pinnacle-tech.in}

logging:
  level:
    root: INFO
    com.example.chat: DEBUG
