name: Deploy Flutter to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'flutter-chat-app/**'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Flutter dependencies
        working-directory: flutter-chat-app
        run: flutter pub get

      # The LLM API key is NOT baked into the web build. The app only knows the
      # URL of the server-side proxy (a Cloudflare Worker, see cloudflare-worker/),
      # which holds the key as a Worker secret and calls the LLM.
      # Set CHAT_API_URL as a repository variable or secret, e.g.
      #   https://chat-llm-proxy.<subdomain>.workers.dev/chat
      - name: Build Flutter web
        working-directory: flutter-chat-app
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL || secrets.CHAT_API_URL }}
        run: flutter build web --release --dart-define=CHAT_API_URL="$CHAT_API_URL"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: buddy-ec712
          entryPoint: flutter-chat-app

      # Firestore rules only (no Cloud Functions — the LLM proxy runs on
      # Cloudflare Workers, so the Blaze plan is not required). Non-blocking.
      - name: Write service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy Firestore rules
        continue-on-error: true
        working-directory: flutter-chat-app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project buddy-ec712 --non-interactive
