services:
  # ── Backend: Spring Boot (Docker) ──────────────────────────────────────────
  - type: web
    name: chat-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                        # change to "starter" ($7/mo) to avoid spin-down
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8082
      - key: GROQ_API_KEY
        sync: false                   # set this secret in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false                   # e.g. https://chat-frontend.onrender.com,https://rakeshbabu238a-bit.github.io

  # ── Frontend: React/Vite (static site) ─────────────────────────────────────
  - type: web
    name: chat-frontend
    runtime: static
    rootDir: chat-app/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        sync: false                   # set to your backend URL in the Render dashboard
    routes:
      - type: rewrite
        source: /*
        destination: /index.html      # enables React client-side routing
