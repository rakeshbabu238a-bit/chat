name = "chat-llm-proxy"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Optional non-secret config. Override the model/endpoint here to switch
# providers (Groq, OpenAI, ...). The API key is NOT set here — it is a secret:
#   wrangler secret put LLM_API_KEY
[vars]
# Provider: Groq (OpenAI-compatible, generous free tier).
# The API key is the GROQ key, stored as the LLM_API_KEY secret:
#   wrangler secret put LLM_API_KEY   (paste your gsk_... Groq key)
LLM_API_URL = "https://api.groq.com/openai/v1/chat/completions"
LLM_MODEL = "openai/gpt-oss-120b"

# To switch back to Gemini instead, comment out the two lines above; the
# Worker then defaults to the Gemini OpenAI-compat endpoint + gemini-flash-latest.

# Lock CORS so only your site(s) can call the Worker (and consume your quota).
# Comma-separated allowlist; the Worker echoes back the matching origin.
ALLOW_ORIGIN = "https://pinnacle-tech.in,https://buddy-ec712.web.app"
